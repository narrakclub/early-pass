<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>narrak club: early pass!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f183b0;
      font-family: 'Press Start 2P', cursive;
      color: #fbf5eb;
    }

    .container {
      background: #c43771;
      border: 6px solid #c43771;
      box-shadow: 0 0 0 6px #fac4d2;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 14px;
      margin-bottom: 16px;
    }

    p {
      font-size: 10px;
      line-height: 1.8;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 10px;
      border: 4px solid #fbf5eb;
      margin-bottom: 14px;
      color: #c43771;
    }

    .btn {
      padding: 12px 16px;
      font-family: inherit;
      font-size: 10px;
      background: #fbf5eb;
      border: 4px solid #fbf5eb;
      cursor: pointer;
      width: 100%;
    }

    .btn:active { transform: translateY(2px); }

    @media (max-width: 480px) {
      h1 { font-size: 12px; }
      p { font-size: 9px; }
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <h1>NARRAK CLUB</h1>
    <p id="text">
      LOVE HAS MANY FORMS.<br /><br />
      BUT HAVE YOU MET THEM ALL?
    </p>
    <button class="btn" id="mainBtn">START</button>
  </div>

  <script>
    const todos = [
      "KONSUL TAROT SOAL HUBUNGAN KALIAN",
      "MARATHON FILM DUA PULUH EMPAT JAM",
      "COSPLAY JADI KHUN THEE DAN PEACHAYARAT",
      "MAIN GAME BARENG YOUR FINESHYT",
      "DENGERIN LAGU KESUKAAN KAMU",
      "HUNTING MAKANAN YANG KAMU LAGI NGIDAM BANGET",
      "BIKIN PLAYLIST BUAT NAIKIN MOOD",
      "BEBERSIH ISI GALERI YANG ISINYA SCREENSHOT DARI MANTAN",
      "NONTON LONG LIVE LOVE",
      "TEBAK-TEBAKAN KHODAM",
      "BELI ALL VARIANT DUBAI CHEWY COOKIE",
      "JOURNALING ON HOW MUCH YOU LOVE YOURSELF",
      "KASIH HADIAH BUAT YOUR LOVED ONE",
      "POST YOUR MOST FAVORITE LOVE SONG",
      "TELL THEM HOW MUCH YOU APPRECIATE THEM",
      "CIUM PELUK JUBJUB YOUR FINESHYT KAMU",
      "BUILD RUMAH DI HEARTOPIA"
    ];

    const text = document.getElementById('text');
    const btn = document.getElementById('mainBtn');
    const app = document.getElementById('app');

    let step = 0;

    btn.onclick = () => {
      if (step === 0) {
        text.innerHTML = "ENTER YOUR NAME:<br /><br />";
        const input = document.createElement('input');
        input.id = 'nameInput';
        input.placeholder = 'TYPE YOUR NAME...';
        app.insertBefore(input, btn);
        btn.textContent = 'SUBMIT';
        step = 1;
      } else if (step === 1) {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) return;
        const task = todos[Math.floor(Math.random() * todos.length)];
        app.innerHTML = `
          <h1>HAI, ${name.toUpperCase()} !</h1>
          <p>KAYAKNYA HARI INI KAMU HARUS,<br /><br />${task}</p>
        `;
      }
    };
  </script>

</body>
</html>
